[package]
name = "mutsuki-cli-host"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.5", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30.2"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time"] }
mutsuki-service-control = { workspace = true }
mutsuki-service-ipc = { workspace = true }

[lints]
workspace = true
