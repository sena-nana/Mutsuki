[package]
name = "mutsuki-bot-web-console"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedded Bot admin console assembly: WebHost + control/overview/config extensions."

[dependencies]
mutsuki-config-service = { workspace = true }
mutsuki-bot-flow = { workspace = true }
mutsuki-plugin-bot-command = { workspace = true }
mutsuki-plugin-config-web = { workspace = true }
mutsuki-plugin-bot-control-web = { workspace = true }
mutsuki-plugin-bot-upgrade-web = { workspace = true }
mutsuki-plugin-bot-overview-web = { workspace = true }
mutsuki-bot-management = { workspace = true }
mutsuki-plugin-bot-bilibili-web = { workspace = true }
mutsuki-plugin-bot-qq-web = { workspace = true }
mutsuki-plugin-bot-agent-web = { workspace = true }
mutsuki-plugin-bot-flow-web = { workspace = true }
mutsuki-service-control = { workspace = true }
mutsuki-web-host = { workspace = true }
mutsuki-web-extension = { workspace = true }
mutsuki-web-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
futures-util = { workspace = true }
mutsuki-bot-protocol = { workspace = true }
mutsuki-service-control = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
uuid = { version = "1", features = ["v4"] }
