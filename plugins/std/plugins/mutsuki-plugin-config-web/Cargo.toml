[package]
name = "mutsuki-plugin-config-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Default Web config plugin: ConfigProvider RPC + auto form WebExtension assets."

[dependencies]
mutsuki-config-service = { workspace = true }
mutsuki-web-protocol = { workspace = true }
mutsuki-web-extension-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
futures-executor.workspace = true

[dev-dependencies]
mutsuki-web-host = { workspace = true }
mutsuki-web-bridge = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
uuid.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true

[lints]
workspace = true
