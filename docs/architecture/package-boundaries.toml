version = 1

# Rules apply to normal and build dependencies. Test-only integration dependencies are
# intentionally excluded because they do not enter production package ownership.

[[rules]]
name = "runtime-contracts-remain-pure"
# The optional execution-policy and portability surfaces are contract crates too.
source_roots = [
  "crates/mutsuki-runtime-contracts",
  "crates/mutsuki-runtime-execution-policy",
  "crates/mutsuki-runtime-portability",
]
forbidden_target_roots = [
  "crates/mutsuki-runtime-core",
  "crates/mutsuki-runtime-host",
  "crates/mutsuki-runtime-sdk",
  "crates/link",
  "hosts",
  "kits",
  "plugins",
  "products",
]

[[rules]]
name = "runtime-wire-remains-a-contract-owner"
source_roots = ["crates/mutsuki-runtime-wire"]
forbidden_target_roots = [
  "crates/mutsuki-runtime-core",
  "crates/mutsuki-runtime-host",
  "crates/mutsuki-runtime-sdk",
  "crates/link",
  "hosts",
  "kits",
  "plugins",
  "products",
]

[[rules]]
name = "runtime-core-remains-domain-neutral"
source_roots = ["crates/mutsuki-runtime-core"]
forbidden_target_roots = [
  "crates/mutsuki-runtime-host",
  "crates/mutsuki-runtime-sdk",
  "crates/link",
  "hosts",
  "kits",
  "plugins",
  "products",
]

[[rules]]
# Plugins, Kits, Hosts and products reach kernel types (`Runner`, `RuntimeResult`, ...) through
# `mutsuki-runtime-sdk`, and scheduler-policy types through `mutsuki-runtime-host`. Only those two
# link the scheduler crate directly, so `TaskPool`, registries and `CoreRuntime` stay unreachable.
name = "only-runtime-host-and-sdk-depend-on-runtime-core"
source_roots = [
  "crates/link",
  "crates/mutsuki-module-catalog",
  "crates/mutsuki-plugin-api",
  "crates/mutsuki-plugin-host",
  "crates/mutsuki-runtime-plugin-loader",
  "hosts",
  "kits",
  "plugins",
  "products",
]
forbidden_target_roots = ["crates/mutsuki-runtime-core"]

[[rules]]
# ServiceHost and TauriHost both read plugin.toml through this crate, so it may not reach back
# into either Host or into domain packages.
name = "runtime-plugin-loader-stays-host-neutral"
source_roots = ["crates/mutsuki-runtime-plugin-loader"]
forbidden_target_roots = ["hosts", "kits", "plugins", "products", "crates/mutsuki-runtime-host"]

[[rules]]
name = "link-does-not-own-host-or-business-behavior"
source_roots = ["crates/link"]
forbidden_target_roots = ["hosts", "kits/agent", "plugins/bot", "products"]

[[rules]]
name = "host-neutral-kits-and-plugins-use-explicit-integration-packages"
source_roots = ["kits/agent", "plugins/bot", "plugins/std"]
forbidden_target_packages = [
  "mutsuki-distributed-runtime",
  "mutsuki-service-runtime",
  "mutsuki-tauri-host",
  "mutsuki-web-host",
  "mutsuki-web-extension",
]
allow_source_packages = [
  "config-demo",
  "mutsuki-agent-benchmarks",
  "mutsuki-agent-distributed-integration",
  "mutsuki-agent-service-host-integration",
  "mutsuki-bot-benchmarks",
  "mutsuki-bot-bilibili-service-host-integration",
  "mutsuki-bot-qq-service-host-integration",
  "mutsuki-bot-service-host-integration",
  "mutsuki-bot-web-host-integration",
  "mutsuki-std-service-host-integration",
]

[[rules]]
name = "protocol-packages-do-not-depend-on-execution-layers"
source_package_prefixes = ["mutsuki-protocol-"]
source_packages = [
  "mutsuki-agent-contracts",
  "mutsuki-bot-console-protocol",
  "mutsuki-bot-protocol",
  "mutsuki-bot-qq-protocol",
  "mutsuki-distributed-contracts",
  "mutsuki-service-control",
  "mutsuki-web-protocol",
]
forbidden_target_roots = [
  "crates/mutsuki-runtime-core",
  "crates/mutsuki-runtime-host",
  "crates/mutsuki-runtime-sdk",
  "hosts/service/crates/mutsuki-service-runtime",
  "hosts/web/crates/mutsuki-web-host",
  "hosts/distributed/crates/mutsuki-distributed-runtime",
]

[[rules]]
name = "web-shared-runtime-is-a-leaf-asset-package"
# Embedded prebuilt browser modules only: any first-party dependency would let a shell
# asset package pull Host, Link or domain code into every console.
source_packages = ["mutsuki-web-shared-runtime"]
forbidden_target_roots = ["crates", "hosts", "kits", "plugins", "products"]

[[rules]]
name = "plugin-implementations-do-not-depend-on-plugin-implementations"
source_package_prefixes = ["mutsuki-plugin-"]
forbidden_target_package_prefixes = ["mutsuki-plugin-"]
allow_target_packages = ["mutsuki-plugin-api"]
# No exceptions: the two console pages used to reach a typed Control RPC client and a
# module-upgrade planner that both sat in the `mutsuki-plugin-` namespace without
# being loadable plugins. They now live with their owners
# (`hosts/web/crates/mutsuki-web-extension-control`, `crates/mutsuki-module-catalog`).

[[rules]]
name = "plugin-implementations-do-not-depend-on-host-integration"
source_package_prefixes = ["mutsuki-plugin-"]
forbidden_target_packages = [
  "mutsuki-agent-bundle",
  "mutsuki-agent-distributed-integration",
  "mutsuki-agent-service-host-integration",
  "mutsuki-bot-bilibili-service-host-integration",
  "mutsuki-bot-qq-service-host-integration",
  "mutsuki-bot-service-host-integration",
  "mutsuki-bot-web-host-integration",
  "mutsuki-std-service-host-integration",
]

[[rules]]
# The sandbox is a simulated platform adapter beside the real ones, not a wrapper around one:
# replies reach it through its own endpoint and live mode observes Flow ingress. Neither its
# library nor its plugin may reach a concrete platform adapter or its Host assembly.
name = "bot-sandbox-adapter-depends-on-no-real-adapter"
source_packages = ["mutsuki-bot-sandbox", "mutsuki-plugin-bot-adapter-sandbox"]
forbidden_target_packages = [
  "mutsuki-bot-bilibili-service-host-integration",
  "mutsuki-bot-qq-protocol",
  "mutsuki-bot-qq-service-host-integration",
  "mutsuki-plugin-bot-adapter-qqbot",
  "mutsuki-plugin-bot-bilibili",
]

[[rules]]
# Real adapters and their Host assembly never wrap the sandbox: they reach it only through the
# shared simulator application service for optional enrichment (QQ's group titles).
name = "real-adapters-do-not-depend-on-the-sandbox"
source_packages = [
  "mutsuki-bot-bilibili-service-host-integration",
  "mutsuki-bot-qq-service-host-integration",
  "mutsuki-plugin-bot-adapter-qqbot",
  "mutsuki-plugin-bot-bilibili",
]
forbidden_target_packages = ["mutsuki-bot-sandbox", "mutsuki-plugin-bot-adapter-sandbox"]
