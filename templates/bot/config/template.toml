# Minimal bootstrap. Editable product configuration is seeded into ConfigRepository.

[host]
instance_id = "mutsuki-bot"
home_dir = ".mutsuki"
data_dir = ".mutsuki/data"

[security]
secret_file = "local.secret.toml"

[plugin_discovery]
dynamic_dirs = [".mutsuki/plugins/installed"]
disabled_dir = ".mutsuki/plugins/disabled"

[config_repository]
repository_plugin_id = "mutsuki.config.repository.sqlite"
document_namespace = "mutsuki-bot"

[config_repository.options]
path = ".mutsuki/config.sqlite3"
