name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # check_workspace.py needs tomllib.
          python-version: "3.11"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check monorepo boundaries
        run: python3 skills/monorepo-maintenance/scripts/check_workspace.py

      - name: Check dependency graph resolves against the committed lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check distributed zero-intrusion boundary
        run: bash scripts/check-distributed-boundary.sh

      # cargo test --all-targets already type-checks lib/bin/test/bench/example.
      - name: Test locked workspace
        run: cargo test --workspace --all-targets --locked

      # Independent of the test result: a failing test used to skip this step,
      # so one flaky test silently switched the lint gate off for as long as it
      # kept failing. `!cancelled()` rather than `always()` so a superseded run
      # still stops immediately under the concurrency group above.
      # The suite must stay inside its TempDirs. A config that declares no
      # `[service] home_dir` silently resolves to the real `$HOME/.mutsuki`, and
      # one test helper did exactly that -- writing data, logs, run state and a
      # control token into the developer's home, where parallel tests then raced
      # over the same directory.
      - name: Check the test suite left no state in HOME
        if: ${{ !cancelled() }}
        run: |
          if [ -e "$HOME/.mutsuki" ]; then
            echo "tests wrote to $HOME/.mutsuki; give the config a home_dir inside its TempDir:"
            find "$HOME/.mutsuki" -maxdepth 2
            exit 1
          fi

      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Performance smoke gate
        if: ${{ !cancelled() }}
        run: cargo bench-smoke

      # The fuzz crate lives outside the root Workspace, so nothing above compiles it. Without this
      # step a target silently rots the moment one of the DTOs it fuzzes changes shape. Running the
      # fuzzers themselves needs nightly and a time budget; that belongs in a scheduled job.
      - name: Check fuzz targets
        if: ${{ !cancelled() }}
        working-directory: fuzz
        run: cargo check --all-targets --locked

      # The Agent examples and templates are also `exclude`d from the root workspace,
      # so nothing above compiles them either. They had drifted: a blanket
      # `lints.workspace = true` made all four unbuildable (an excluded package has no
      # workspace to inherit from), and behind that the model-provider pair had gone
      # stale against `AgentModelGenerateResult`. A template nobody compiles is a
      # template that does not work when someone copies it.
      - name: Check excluded Agent examples and templates
        if: ${{ !cancelled() }}
        run: |
          for crate in \
            kits/agent/examples/rust-agent-tool \
            kits/agent/examples/rust-model-provider \
            kits/agent/templates/rust-agent-tool \
            kits/agent/templates/rust-model-provider
          do
            echo "== $crate"
            cargo check --manifest-path "$crate/Cargo.toml" --all-targets
          done

      - name: Check feature-gated Link examples
        if: ${{ !cancelled() }}
        # `--all-targets` silently skips an example whose `required-features` are
        # off, so the workspace build never compiles these five. The only thing
        # that did was crates/link/scripts/check-boundaries.sh, which runs solely
        # from a nested workflow GitHub never schedules. `mdns` and
        # `system-keyring` stay off on purpose: they pull a system discovery and
        # credential backend that this runner has no packages for.
        run: cargo check -p mutsuki-link --features local,tcp,quic,discovery,pairing --all-targets

      - name: Test DistributedHost localization testkit
        if: ${{ !cancelled() }}
        # `localization-testkit` injects storage faults and blocking panics, so it
        # rightly stays out of the default feature set -- but that also means the
        # four content-localization tests behind it were run by no workflow at all,
        # not even the nested one. They cover atomic publish, hash-mismatch
        # cleanup, fault/panic partial retention and timeout cancellation: the
        # failure modes least acceptable to leave unverified.
        run: cargo test -p mutsuki-distributed-runtime --features localization-testkit --all-targets --locked

      # `rust-version` is a promise to anyone building this workspace, and nothing
      # verified it: CI builds `stable`, so the declared floor could drift for
      # releases without anyone noticing. The version is read from the manifest
      # rather than duplicated here, so bumping it there moves this check too.
      - name: Check the declared MSRV still builds
        if: ${{ !cancelled() }}
        run: |
          msrv=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['rust-version'])")
          echo "declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --locked

      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

  python:
    name: Python runner kit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kits/python-runner
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  frontend:
    name: Frontend (${{ matrix.owner }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: WebHost
            directory: hosts/web
            build: pnpm build
          - owner: TauriHost
            directory: hosts/tauri
            build: pnpm typecheck
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.build }}

      # `browser/*.js` and `ui/dist/*` are built artifacts that are committed, because
      # the Rust console embeds them with include_bytes!/include_str!. Building them in
      # CI proves they *can* be built; it does not prove the committed copies match the
      # sources. Without this, editing a .ts and forgetting to rebuild leaves CI green
      # while the console keeps shipping the previous bundle.
      - name: Check committed build artifacts are up to date
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build changed committed artifacts. Rebuild and commit them:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
