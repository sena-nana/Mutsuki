name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # check_workspace.py needs tomllib.
          python-version: "3.11"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check monorepo boundaries
        run: python3 skills/monorepo-maintenance/scripts/check_workspace.py

      - name: Check dependency graph resolves against the committed lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check distributed zero-intrusion boundary
        run: bash scripts/check-distributed-boundary.sh

      - name: Check locked workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test locked workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Performance smoke gate
        run: cargo bench-smoke

      # The fuzz crate lives outside the root Workspace, so nothing above compiles it. Without this
      # step a target silently rots the moment one of the DTOs it fuzzes changes shape. Running the
      # fuzzers themselves needs nightly and a time budget; that belongs in a scheduled job.
      - name: Check fuzz targets
        working-directory: fuzz
        run: cargo check --all-targets --locked

      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

  python:
    name: Python runner kit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kits/python-runner
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  frontend:
    name: Frontend (${{ matrix.owner }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: WebHost
            directory: hosts/web
            build: pnpm build
          - owner: TauriHost
            directory: hosts/tauri
            build: pnpm typecheck
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.build }}
