name: Publish Bot template

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable Mutsuki release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-bot-template
  cancel-in-progress: false

jobs:
  publish:
    name: Publish generated repository
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Validate publication inputs
        env:
          TEMPLATE_DEPLOY_KEY: ${{ secrets.MUTSUKI_BOT_TEMPLATE_DEPLOY_KEY }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must be a semantic release tag" >&2
            exit 1
          fi
          if [[ -z "${TEMPLATE_DEPLOY_KEY}" ]]; then
            echo "MUTSUKI_BOT_TEMPLATE_DEPLOY_KEY is not configured" >&2
            exit 1
          fi

      - name: Checkout publication tooling
        uses: actions/checkout@v7
        with:
          path: automation

      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          repository: sena-nana/Mutsuki
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: release-source

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Export released template
        run: >-
          python3 automation/templates/bot/scripts/export_template.py
          --source release-source/templates/bot
          --root-manifest release-source/Cargo.toml
          --output "${RUNNER_TEMP}/mutsuki-bot-template"
          --tag "${RELEASE_TAG}"

      - name: Validate exported template
        working-directory: ${{ runner.temp }}/mutsuki-bot-template
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mutsuki-bot-template-target
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo fmt --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --all-targets --locked

      - name: Checkout generated repository
        uses: actions/checkout@v7
        with:
          repository: sena-nana/MutsukiBotTemplate
          ref: main
          path: published-template
          ssh-key: ${{ secrets.MUTSUKI_BOT_TEMPLATE_DEPLOY_KEY }}

      - name: Synchronize generated repository
        id: synchronize
        run: |
          source="${RUNNER_TEMP}/mutsuki-bot-template"
          target="published-template"
          for forbidden in target artifacts .codegraph; do
            if [[ -e "${source}/${forbidden}" ]]; then
              echo "generated entry cannot be published: ${forbidden}" >&2
              exit 1
            fi
          done
          changes="$(rsync --archive --checksum --delete --dry-run --itemize-changes \
            --exclude='.git/' "${source}/" "${target}/")"
          if [[ -z "${changes}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          rsync --archive --checksum --delete --itemize-changes \
            --exclude='.git/' "${source}/" "${target}/"
          remaining="$(rsync --archive --checksum --delete --dry-run --itemize-changes \
            --exclude='.git/' "${source}/" "${target}/")"
          if [[ -n "${remaining}" ]]; then
            echo "generated repository still differs after synchronization" >&2
            exit 1
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Publish generated revision
        if: steps.synchronize.outputs.changed == 'true'
        working-directory: published-template
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "同步 Mutsuki Bot 模板 ${RELEASE_TAG}"
          git push origin HEAD:main
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"

      - name: Record publication
        run: |
          {
            echo "### Bot template publication"
            echo
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- Repository: https://github.com/sena-nana/MutsukiBotTemplate"
            echo "- Changed: \`${{ steps.synchronize.outputs.changed }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
