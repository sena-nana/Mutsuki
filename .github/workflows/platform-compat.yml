name: Platform compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - run: cargo metadata --locked --format-version 1
      - run: cargo fmt --check
      - run: bash scripts/check-distributed-boundary.sh
      - run: cargo check --locked
      - run: cargo test --locked
