name: Platform compatibility

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Linux full workspace gate lives in ci.yml. This workflow only covers other OSes.
jobs:
  macos:
    name: Rust (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup component add rust-analyzer
      - run: cargo test --workspace --all-targets --locked

  windows-host-metrics:
    name: Windows HostMetrics
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable
      - run: cargo test --locked -p mutsuki-service-control -p mutsuki-service-runtime
