name: Public performance smoke

on:
  schedule:
    - cron: "23 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      fixed_reference:
        description: Run the fixed macOS ARM64 and Windows x64 reference lanes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  full-smoke:
    name: Full correctness and catastrophic-regression matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run full public-runner smoke
        run: >-
          cargo run --release --package mutsuki-runtime-benchmarks --
          full
          --lane time
          --warmup 1
          --samples 3
          --gate smoke
          --output target/mutsuki-benchmarks/core-public-ci-${{ github.run_id }}.json

      - name: Upload structured smoke result
        uses: actions/upload-artifact@v7
        with:
          name: core-public-performance-smoke-${{ github.run_id }}
          path: target/mutsuki-benchmarks/core-public-ci-${{ github.run_id }}.json
          retention-days: 90

      - name: Explain evidence boundary
        run: >-
          echo "Public runner results are smoke evidence only and cannot approve or replace a release baseline."

  bot-smoke:
    name: Bot owner performance model
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The owner gate lived only in plugins/bot/.github/workflows, which GitHub
      # never schedules -- only the repository root is. It went unrun long enough to
      # break outright: the benchmark asked for the SQLite media provider the QQ
      # adapter binds to, without registering it, so the LoadPlan was rejected before
      # the first case. Scheduling it here is what keeps that from recurring.
      - name: Run Bot owner smoke
        run: >-
          python3 plugins/bot/scripts/run-performance-model.py
          --mode smoke
          --output target/mutsuki-benchmarks/bot-smoke-${{ github.run_id }}.json

      - name: Upload structured smoke result
        uses: actions/upload-artifact@v7
        with:
          name: bot-performance-smoke-${{ github.run_id }}
          path: target/mutsuki-benchmarks/
          retention-days: 90

      - name: Explain evidence boundary
        run: >-
          echo "Public runner results are smoke evidence only and cannot approve or replace a release baseline."

  # Every owner model, not just Bot's. Bot's own gate had rotted unnoticed
  # precisely because it lived in a per-package workflow that GitHub never
  # schedules, so the remaining owners are scheduled here rather than left to
  # the pre-monorepo files under each package's own `.github/`.
  owner-smoke:
    name: Owner performance model (${{ matrix.owner }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: link
            script: crates/link/scripts/run-performance-model.py
          - owner: distributed
            script: hosts/distributed/scripts/run-performance-model.py
          - owner: agent
            script: kits/agent/scripts/run-performance-model.py
          - owner: std
            script: plugins/std/scripts/run-performance-model.py
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Run ${{ matrix.owner }} owner smoke
        run: >-
          python3 ${{ matrix.script }}
          --mode smoke
          --output target/mutsuki-benchmarks/${{ matrix.owner }}-smoke-${{ github.run_id }}.json
      - name: Upload structured smoke result
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.owner }}-performance-smoke-${{ github.run_id }}
          path: target/mutsuki-benchmarks/
          retention-days: 90
      - name: Explain evidence boundary
        run: echo "Public runner results are smoke evidence only and cannot approve or replace a release baseline."

  fixed-reference:
    name: Fixed reference (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' && inputs.fixed_reference
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            labels: [self-hosted, mutsuki-reference, macOS, ARM64]
          - name: windows-x64
            labels: [self-hosted, mutsuki-reference, Windows, X64]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 360
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run owner reference
        run: >-
          python scripts/run-core-reference.py
          --mode full
          --output artifacts/perf/reference-${{ matrix.name }}/report.json
      - uses: actions/upload-artifact@v7
        with:
          name: core-reference-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts/perf/reference-${{ matrix.name }}/
          retention-days: 90
          if-no-files-found: error
