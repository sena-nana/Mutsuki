# Single pnpm workspace for every browser package in the monorepo. Packages live next to
# their Rust owner: shared WebHost packages under hosts/web/packages, extension frontends in
# the owning crate's `web/` directory. hosts/tauri keeps its own workspace.
packages:
  - "hosts/web/packages/*"
  - "hosts/web/crates/*/web"
  - "plugins/*/crates/*/web"
  - "kits/*/crates/*/web"

# Shared runtime versions are pinned once. Extension packages reference them with
# `catalog:` so the shell and every extension agree on one vue/vue-router/pinia.
catalog:
  "@axe-core/playwright": ^4.14.0
  "@msgpack/msgpack": ^3.1.3
  "@playwright/test": ^1.64.1
  "@types/node": ^26.6.5
  "@vitejs/plugin-vue": ^6.0.10
  "@vue/test-utils": ^2.5.1
  axe-core: ^4.14.0
  es-module-lexer: ^3.0.4
  happy-dom: ^21.0.4
  pinia: ^3.0.4
  typescript: ^5.9.3
  vite: ^8.3.5
  vitest: ^5.0.5
  vitest-axe: ^0.1.0
  vue: ^3.5.44
  vue-router: ^4.6.4
  vue-tsc: ^3.3.13
