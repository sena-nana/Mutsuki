[workspace]
members = [
    "crates/mutsuki-web-protocol",
    "crates/mutsuki-web-extension",
    "crates/mutsuki-web-bridge",
    "crates/mutsuki-web-recovery",
    "crates/mutsuki-web-host",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
mime_guess = "2.0"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1.38", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Cross-repo pins: fixed Git rev only. No out-of-repo path/patch.
mutsuki-link-core = { git = "https://github.com/sena-nana/MutsukiLink.git", rev = "26c66311e0e90ddb28d37e886bdda699f8662439" }
mutsuki-link-local = { git = "https://github.com/sena-nana/MutsukiLink.git", rev = "26c66311e0e90ddb28d37e886bdda699f8662439" }

mutsuki-web-protocol = { path = "crates/mutsuki-web-protocol" }
mutsuki-web-extension = { path = "crates/mutsuki-web-extension" }
mutsuki-web-bridge = { path = "crates/mutsuki-web-bridge" }
mutsuki-web-recovery = { path = "crates/mutsuki-web-recovery" }
mutsuki-web-host = { path = "crates/mutsuki-web-host" }
